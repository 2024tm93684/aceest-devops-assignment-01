apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      variant: a
  template:
    metadata:
      labels:
        app: aceest-fitness
        variant: a
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.1.2   # variant A
        ports:
        - containerPort: 8080
        env:
        - name: APP_VARIANT
          value: "A"