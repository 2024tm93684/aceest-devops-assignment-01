apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      variant: b
  template:
    metadata:
      labels:
        app: aceest-fitness
        variant: b
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.2.4   # variant B
        ports:
        - containerPort: 8080
        env:
        - name: APP_VARIANT
          value: "B"