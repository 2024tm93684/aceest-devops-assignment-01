apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: blue
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.1.2   # current stable
        ports:
        - containerPort: 8080