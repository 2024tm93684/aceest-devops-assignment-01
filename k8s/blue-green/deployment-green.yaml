apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      slot: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: green
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.2.4   # new version
        ports:
        - containerPort: 8080