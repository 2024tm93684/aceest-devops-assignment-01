apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: primary
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.1.2
        ports:
        - containerPort: 8080