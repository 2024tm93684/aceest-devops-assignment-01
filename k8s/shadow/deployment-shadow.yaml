apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: shadow
    spec:
      containers:
      - name: aceest-fitness
        image: hisajwan/aceest-fitness:v3.2.4   # new version being tested
        ports:
        - containerPort: 8080