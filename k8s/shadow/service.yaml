apiVersion: v1
kind: Service
metadata:
  name: aceest-primary-service
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    role: primary
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081   # live traffic
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    role: shadow
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082   # shadow traffic (responses discarded)